name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: .exe
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/wedraw-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/wedraw

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: wedraw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  malware-scan:
    name: Malware scan
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Install ClamAV
        run: sudo apt-get update && sudo apt-get install --yes clamav

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout --verbose

      - name: Scan release binaries
        run: clamscan --infected --recursive --no-summary dist

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, malware-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Package release archives
        shell: bash
        run: |
          zip -j dist/wedraw-windows-amd64.zip dist/wedraw-windows-amd64.exe
          zip -j dist/wedraw-linux-amd64.zip dist/wedraw-linux-amd64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete-asset "${GITHUB_REF_NAME}" wedraw-windows-amd64.exe --yes || true
            gh release delete-asset "${GITHUB_REF_NAME}" wedraw-linux-amd64 --yes || true
            gh release upload "${GITHUB_REF_NAME}" dist/wedraw-windows-amd64.zip dist/wedraw-linux-amd64.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/wedraw-windows-amd64.zip dist/wedraw-linux-amd64.zip --generate-notes --title "wedraw ${GITHUB_REF_NAME}"
          fi
